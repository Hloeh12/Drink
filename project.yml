name: 打卡助手
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  打卡助手:
    type: application
    platform: iOS
    sources:
      - path: 打卡助手
    dependencies:
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dakazhushou
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 打卡助手
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_LSRequiresIPhoneOS: true
    entitlements:
      path: 打卡助手/打卡助手.entitlements
      properties:
        com.apple.developer.applesignin: ["Default"]
schemes:
  打卡助手:
    build:
      targets:
        打卡助手: all
    run:
      config: Debug
    archive:
      config: Release
