project:
  name: Drink
  targets:
    Drink:
      type: application
      platform: iOS
      sources:
        - path: .
          includes:
            - "**/*"
            - "!**/*.xcodeproj"
      config:
        base: Release
        configList:
          Debug:
            provisioningStyle: automatic
          Release:
            provisioningStyle: automatic
      settings:
        PRODUCT_BUNDLE_IDENTIFIER: com.hloeh12.drink
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
