name: Deploy to Supabase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Supabase
        run: |
          curl -s https://raw.githubusercontent.com/supabase/supabase/master/.github/actions/deploy-supabase/main.sh | bash
